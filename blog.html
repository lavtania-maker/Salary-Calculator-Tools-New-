<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HR and Salary Blog Malaysia 2026</title>
<meta name="description" content="Free HR and payroll guides for Malaysian employees and employers." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://salarycalculator.my/blog" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/public/calculator-styles.css" />
<style>
body{font-family:Inter,sans-serif;margin:0;background:#f8fafc;color:#0f172a;}
.blog-hero{background:#fff;border-bottom:1px solid #e2e8f0;padding:48px 20px 40px;text-align:center;}
.blog-hero h1{font-size:2rem;font-weight:700;color:#2563eb;margin:0 0 10px;}
.blog-hero p{font-size:1rem;color:#64748b;margin:0;}
.blog-container{max-width:1100px;margin:0 auto;padding:36px 20px 60px;}
.category-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px;justify-content:center;}
.cat-btn{padding:6px 16px;border-radius:20px;border:1.5px solid #e2e8f0;background:white;font-size:.875rem;font-weight:500;cursor:pointer;color:#475569;}
.cat-btn.active{border-color:#2563eb;background:#2563eb;color:white;}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media(max-width:900px){.blog-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:580px){.blog-grid{grid-template-columns:1fr;}}
.blog-card{background:white;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;text-decoration:none;display:block;color:inherit;}
.blog-card:hover{box-shadow:0 6px 20px rgba(37,99,235,.10);border-color:#93c5fd;}
.card-thumb{width:100%;aspect-ratio:16/9;background:#eff6ff;display:flex;align-items:center;justify-content:center;}
.card-body{padding:18px 20px 20px;}
.cat-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600;margin-bottom:10px;text-transform:uppercase;}
.tag-epf{background:#dbeafe;color:#1d4ed8;}.tag-pcb{background:#ede9fe;color:#6d28d9;}.tag-socso{background:#ffedd5;color:#c2410c;}.tag-employment{background:#dcfce7;color:#15803d;}.tag-salary{background:#fee2e2;color:#b91c1c;}.tag-minwage{background:#cffafe;color:#0e7490;}.tag-default{background:#f1f5f9;color:#475569;}
.card-title{font-size:1rem;font-weight:600;color:#0f172a;margin:0 0 8px;line-height:1.4;}
.card-desc{font-size:.875rem;color:#64748b;margin:0 0 14px;line-height:1.55;}
.read-more{font-size:.875rem;color:#2563eb;font-weight:500;}
.empty-state{text-align:center;padding:60px 20px;color:#94a3b8;grid-column:1/-1;}
.loading{text-align:center;padding:60px;grid-column:1/-1;color:#64748b;}
footer{background:#f8fafc;border-top:1px solid #e2e8f0;color:#64748b;text-align:center;padding:28px 20px;font-size:.875rem;}
footer a{color:#2563eb;text-decoration:none;margin:0 10px;}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-container"><a href="/" class="nav-logo"><span class="logo-text">SalaryCalculator<span class="logo-dot">.my</span></span></a><div class="nav-links"><a href="/" class="nav-link">Salary</a><a href="/epf-kwsp" class="nav-link">EPF</a><a href="/socso-perkeso" class="nav-link">SOCSO</a><a href="/pcb-income-tax" class="nav-link">PCB</a><a href="/annual-leave-calculator" class="nav-link">Annual Leave</a><a href="/blog" class="nav-link active">Blog</a></div><button class="nav-toggle">Menu</button></div></nav>
<div class="blog-hero"><h1>HR and Salary Blog Malaysia</h1><p>Guides and tips for Malaysian employees and employers</p></div>
<div class="blog-container">
<div class="category-filter"><button class="cat-btn active" onclick="fp(this,'all')">All</button><button class="cat-btn" onclick="fp(this,'epf')">EPF</button><button class="cat-btn" onclick="fp(this,'pcb')">PCB</button><button class="cat-btn" onclick="fp(this,'socso')">SOCSO</button><button class="cat-btn" onclick="fp(this,'employment')">Employment Law</button><button class="cat-btn" onclick="fp(this,'salary')">Salary Tips</button><button class="cat-btn" onclick="fp(this,'minwage')">Minimum Wage</button></div>
<div class="blog-grid" id="blogGrid"><div class="loading">Loading articles...</div></div>
</div>
<footer><p>2026 SalaryCalculator.my</p><p><a href="/privacy-policy">Privacy Policy</a></p></footer>
<script>
var SU='https://script.google.com/macros/s/AKfycbyTPw8wCwuGBnyilrs76sF30miUCf1WreXe2ETKKzsaUXlECfquGMlw6juC7--XMu3YVg/exec',AP=[];
function gc(c){var v=(c||'').toLowerCase();if(v.indexOf('epf')>-1)return 'tag-epf';if(v.indexOf('pcb')>-1)return 'tag-pcb';if(v.indexOf('socso')>-1)return 'tag-socso';if(v.indexOf('employment')>-1)return 'tag-employment';if(v.indexOf('salary')>-1)return 'tag-salary';if(v.indexOf('wage')>-1)return 'tag-minwage';return 'tag-default';}
function rp(posts){var g=document.getElementById('blogGrid'),pub=posts.filter(function(p){return p.status==='published';});if(!pub.length){g.innerHTML='<div class="empty-state">No articles yet.</div>';return;}var h='';for(var i=0;i<pub.length;i++){var p=pub[i];h+='<a class="blog-card" href="/blog/'+p.slug+'"><div class="card-thumb"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></div><div class="card-body"><span class="cat-tag '+gc(p.category)+'">'+(p.category||'')+'</span><div class="card-title">'+p.title+'</div><div class="card-desc">'+(p.summary||'')+'</div><div class="card-meta">'+(p.date||'')+' - '+(p.readTime||5)+' min read</div><span class="read-more">Read More</span></div></a>';}g.innerHTML=h;}
function fp(b,c){var bs=document.querySelectorAll('.cat-btn');for(var i=0;i<bs.length;i++)bs[i].classList.remove('active');b.classList.add('active');rp(c==='all'?AP:AP.filter(function(p){return(p.category||'').toLowerCase().indexOf(c)>-1;}));}
fetch(SU+'?action=getPosts').then(function(r){return r.json();}).then(function(d){AP=d.posts||[];rp(AP);}).catch(function(){document.getElementById('blogGrid').innerHTML='<div class="empty-state">Could not load articles.</div>';});
var nt=document.querySelector('.nav-toggle'),nl=document.querySelector('.nav-links');if(nt&&nl)nt.addEventListener('click',function(){nl.classList.toggle('open');});
</script>
</body>
</html>
