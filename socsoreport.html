<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="https://s3-ap-southeast-1.amazonaws.com/ricebowl/images/marketing-campaign/image-a042dd24-6c42-4872-bcca-15280045d191.png">
  <title>SOCSO Contribution Report</title>
  <style>
    body { 
        font-family: Arial, sans-serif; 
        padding: 40px; 
        color: #333; 
        max-width: 800px; 
        margin: 0 auto; 
    }
    .header { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 2px solid #000; 
        padding-bottom: 20px; 
        margin-bottom: 30px; 
    }
    .company-name { 
        font-size: 24px; 
        font-weight: bold; 
        color: #2563eb; 
    }
    .report-title { 
        font-size: 20px; 
        font-weight: bold; 
        color: #64748b;
    }
    .row { 
        display: flex; 
        justify-content: space-between; 
        padding: 12px 0; 
        border-bottom: 1px solid #e2e8f0; 
    }
    .row.bold { 
        font-weight: bold; 
        color: #0f172a;
    }
    .btn { 
        padding: 10px 20px; 
        background-color: #2563eb; 
        color: white; 
        border: none; 
        border-radius: 4px; 
        cursor: pointer; 
        font-size: 16px;
        font-weight: 600;
    }
    .btn:hover {
        background-color: #1d4ed8;
    }
    .print-controls {
        text-align: right; 
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px dashed #cbd5e1;
    }
    .ai-content {
        line-height: 1.6;
        white-space: pre-wrap;
        margin-top: 20px;
    }
    .loading {
        text-align: center;
        padding: 40px;
        color: #64748b;
    }
    @media print {
      .print-controls { display: none; }
      body { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="print-controls">
    <button class="btn" onclick="window.print()">Print to PDF</button>
  </div>

  <div class="header">
    <div class="company-name" id="company">SalaryCalc MY</div>
    <div class="report-title">SOCSO Report</div>
  </div>

  <div id="loading" class="loading">Generating AI Report...</div>
  <div id="report-container" style="display: none;">
    <div id="ai-output" class="ai-content"></div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "@google/genai";

    const params = new URLSearchParams(window.location.search);
    
    // API Key from Vite define (process.env.GEMINI_API_KEY)
    const apiKey = (typeof process !== 'undefined' && process.env && process.env.GEMINI_API_KEY);
    
    const salary = params.get("salary") || "0";
    const employee = params.get("employee") || "0";
    const employer = params.get("employer") || "0";
    const total = params.get("total") || "0";
    const category = params.get("category") || "N/A";
    const bracket = parseInt(params.get("bracket") || "0");
    const company = params.get("company");

    if (company) document.getElementById("company").innerText = company;

    function getSalaryBand(bracket) {
      if (bracket === 1) return "Wages up to RM30";
      if (bracket === 2) return "Exceed RM30 but not exceed RM50";
      if (bracket === 3) return "Exceed RM50 but not exceed RM70";
      if (bracket === 4) return "Exceed RM70 but not exceed RM100";
      if (bracket === 5) return "Exceed RM100 but not exceed RM140";
      if (bracket === 6) return "Exceed RM140 but not exceed RM200";
      if (bracket === 65) return "Wages exceed RM6,000";
      
      const lower = (bracket - 7) * 100 + 200;
      const upper = lower + 100;
      return `Exceed RM${lower.toLocaleString('en-MY')} but not exceed RM${upper.toLocaleString('en-MY')}`;
    }

    async function generateReport() {
      const outputEl = document.getElementById("ai-output");
      const loadingEl = document.getElementById("loading");

      if (!apiKey) {
        console.warn("Gemini API Key missing.");
        loadingEl.innerText = "Configuration Error: API Key not found. Please ensure GEMINI_API_KEY is set.";
        return;
      }

      try {
        const ai = new GoogleGenAI({ apiKey: apiKey });

        const salary_band = getSalaryBand(bracket);

        const prompt = `Generate a clean, professional SOCSO Contribution Report in simple English.

Keep it short, clear, and HR-friendly. Do not use complex words.

Structure:

Title:
SOCSO Contribution Report

Section 1: Summary

Salary: RM ${parseFloat(salary).toLocaleString('en-MY', {minimumFractionDigits: 2})}
Employee Contribution: RM ${parseFloat(employee).toLocaleString('en-MY', {minimumFractionDigits: 2})}
Employer Contribution: RM ${parseFloat(employer).toLocaleString('en-MY', {minimumFractionDigits: 2})}
Total Contribution: RM ${parseFloat(total).toLocaleString('en-MY', {minimumFractionDigits: 2})}
Category: ${category}

Section 2: Contribution Details

Based on SOCSO Contribution Table
Salary Band: ${salary_band}

Section 3: Employer Notes

SOCSO must be paid before 15th of each month
Late payment may incur penalties
Applicable to eligible employees

Section 4: Disclaimer
This calculator is for reference only. Please check official PERKESO guidelines for accurate deductions.

Make the tone professional, simple, and easy to read.
Do not add extra sections.
Do not include EIS or other deductions.`;

        const response = await ai.models.generateContent({
          model: "gemini-3-flash-preview",
          contents: prompt
        });

        const text = response.text || "";

        // Remove markdown formatting if AI adds it (e.g. ```text)
        const cleanText = text.replace(/```[a-z]*\n?/gi, '').replace(/```/g, '').trim();

        outputEl.innerText = cleanText;
        loadingEl.style.display = "none";
        document.getElementById("report-container").style.display = "block";
      } catch (error) {
        console.error("AI Generation failed:", error);
        loadingEl.innerText = "Error generating report: " + error.message;
      }
    }

    generateReport();
  </script>
</body>
</html>
