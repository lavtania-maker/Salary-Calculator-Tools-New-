    <script>
      (function() {
        var ignoreScriptError = function(msg) {
          if (!msg) return true; // Treat empty message as something to ignore
          var s = msg.toString().toLowerCase();
          return s.indexOf("script error") > -1 || s === "script error." || s.indexOf("uncaught script error") > -1;
        };

        // 1. window.onerror
        var oldOnError = window.onerror;
        window.onerror = function (message, source, lineno, colno, error) {
          if (ignoreScriptError(message)) {
            console.warn("[SalaryCalc] Script error suppressed (window.onerror).");
            return true;
          }
          if (typeof oldOnError === 'function') {
            return oldOnError.apply(this, arguments);
          }
        };

        // 2. addEventListener('error')
        window.addEventListener('error', function(event) {
          if (ignoreScriptError(event.message)) {
            console.warn("[SalaryCalc] Script error suppressed (addEventListener).");
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        
        // 3. handle unhandledrejection
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && ignoreScriptError(event.reason.message)) {
            console.warn("[SalaryCalc] Script error suppressed (unhandledrejection).");
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>

    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-light: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border: #e2e8f0;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-light);
        color: var(--text-main);
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      .card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        margin-bottom: 20px;
      }
      .btn {
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        background: var(--primary);
        color: white;
        font-size: 15px;
      }
      .btn:hover {
        background: var(--primary-hover);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      th {
        background-color: #f1f5f9;
        font-weight: 600;
        font-size: 15px;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      td {
        font-size: 15px;
      }
      #loginSection,
      #adminSection {
        display: none;
      }
      .error {
        color: #dc2626;
        margin-top: 10px;
        font-size: 15px;
      }
    </style>

        JavaScript is required to use the admin dashboard. Please enable JavaScript in your browser settings.
      </div>
    </noscript>
    <div class="container">
      <div class="card" id="loginSection">
        <h1>Admin Login</h1>
        <p style="color: var(--text-muted); margin-bottom: 20px">
          Please sign in with your Admin ID and password.
        </p>
        <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px">
          <div>
            <label for="adminEmail" style="
                display: block;
                margin-bottom: 5px;
                font-size: 15px;
                font-weight: 500;
              ">Admin ID (Email)</label>
            <input type="email" id="adminEmail" required="" style="
                width: 100%;
                padding: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
                box-sizing: border-box;
              ">
          </div>
          <div>
            <label for="adminPassword" style="
                display: block;
                margin-bottom: 5px;
                font-size: 15px;
                font-weight: 500;
              ">Password</label>
            <input type="password" id="adminPassword" required="" style="
                width: 100%;
                padding: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
                box-sizing: border-box;
              ">
          </div>
          <button type="submit" id="loginBtn" class="btn" style="margin-top: 10px">
            Sign In
          </button>
        </form>
        <div id="loginError" class="error"></div>
      </div>

      <div class="card" id="adminSection">
        <div style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          ">
          <h1 style="margin: 0">Captured Leads</h1>
          <div style="display: flex; gap: 10px">
            <button id="exportBtn" class="btn" style="background: #10b981">
              Export CSV
            </button>
            <button id="logoutBtn" class="btn" style="background: #ef4444">
              Logout
            </button>
          </div>
        </div>
        <div style="overflow-x: auto">
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>Phone</th>
                <th>User Type</th>
                <th>Hiring Status</th>
                <th>Action</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody">
              <tr>
                <td colspan="3" style="text-align: center; color: var(--text-muted)">
                  Loading...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
