<script>
var SU='https://script.google.com/macros/s/AKfycbyTPw8wCwuGBnyilrs76sF30miUCf1WreXe2ETKKzsaUXlECfquGMlw6juC7--XMu3YVg/exec';
function gc(c){var v=(c||'').toLowerCase();if(v.indexOf('epf')>-1)return 'tag-epf';if(v.indexOf('pcb')>-1)return 'tag-pcb';if(v.indexOf('socso')>-1)return 'tag-socso';if(v.indexOf('employment')>-1)return 'tag-employment';if(v.indexOf('salary')>-1)return 'tag-salary';if(v.indexOf('wage')>-1)return 'tag-minwage';return 'tag-default';}
function getSlug(){var p=window.location.pathname;var parts=p.split('/');return parts[parts.length-1]||parts[parts.length-2]||'';}  
function render(post){
  document.getElementById('pageTitle').textContent=post.title+' - SalaryCalculator.my';
  document.getElementById('pageDesc').setAttribute('content',post.metaDesc||post.summary||post.title);
  document.getElementById('pageCanonical').setAttribute('href','https://salarycalculator.my/blog/'+post.slug);
  document.getElementById('articleWrap').innerHTML=
feat: add blog-post.html article template    +'<div class="breadcrumb"><a href="/">Home</a> &rsaquo; <a href="/blog">Blog</a> &rsaquo; '+post.title+'</div>'
    +'<div class="article-header">'
    +'<span class="cat-tag '+gc(post.category)+'">'+(post.category||'')+'</span>'
    +'<h1 class="article-title">'+post.title+'</h1>'
    +'<div class="article-meta"><span>'+(post.date||'')+'</span><span>'+(post.readTime||5)+' min read</span></div>'
    +'</div>'
    +'<hr class="divider">'
    +'<div class="article-content">'+(post.content||'')+'</div>';
}
fetch(SU+'?action=getPosts')
  .then(function(r){return r.json();})
  .then(function(data){
    var slug=getSlug();
    var posts=data.posts||[];
    var post=posts.find(function(p){return p.slug===slug;});
    if(post){render(post);}
    else{document.getElementById('articleWrap').innerHTML='<div class="error-state"><h2>Article not found</h2><p>This article does not exist or has been removed.</p><a href="/blog" style="color:#2563eb">Back to Blog</a></div>';}
  })
  .catch(function(){
    document.getElementById('articleWrap').innerHTML='<div class="error-state"><h2>Could not load article</h2><p>Please try again later.</p><a href="/blog" style="color:#2563eb">Back to Blog</a></div>';
  });
var nt=document.querySelector('.nav-toggle'),nl=document.querySelector('.nav-links');if(nt&&nl)nt.addEventListener('click',function(){nl.classList.toggle('open');});
</script>
