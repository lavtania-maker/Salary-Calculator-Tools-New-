<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<title>Blog Admin – SalaryCalculator.my</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;}
.topbar{background:#1e293b;color:white;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;}
.topbar h1{font-size:1.125rem;font-weight:600;}
.topbar a{color:#94a3b8;text-decoration:none;font-size:0.875rem;margin-left:20px;}
.container{max-width:1200px;margin:0 auto;padding:32px 24px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px;}
.stat-card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:20px 24px;}
.stat-label{font-size:0.75rem;font-weight:600;text-transform:uppercase;color:#64748b;margin-bottom:8px;}
.stat-value{font-size:2rem;font-weight:700;color:#0f172a;}
.green{color:#16a34a;} .amber{color:#d97706;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.search-input{border:1px solid #e2e8f0;border-radius:8px;padding:10px 16px;font-size:0.875rem;width:300px;outline:none;font-family:inherit;}
.search-input:focus{border-color:#2563eb;}
.btn-add{background:#2563eb;color:white;padding:10px 20px;border-radius:8px;font-weight:600;font-size:0.875rem;cursor:pointer;border:none;font-family:inherit;}
.table-wrap{background:white;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead tr{background:#f8fafc;}
th{padding:12px 16px;text-align:left;font-size:0.75rem;font-weight:600;text-transform:uppercase;color:#64748b;border-bottom:1px solid #e2e8f0;}
td{padding:14px 16px;border-bottom:1px solid #f1f5f9;font-size:0.875rem;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600;}
.badge-pub{background:#dcfce7;color:#16a34a;} .badge-draft{background:#fef9c3;color:#a16207;}
.btn-edit{background:#eff6ff;color:#2563eb;padding:6px 12px;border-radius:6px;font-size:0.8rem;cursor:pointer;border:none;font-family:inherit;font-weight:500;margin-right:6px;}
.btn-del{background:#fee2e2;color:#b91c1c;padding:6px 12px;border-radius:6px;font-size:0.8rem;cursor:pointer;border:none;font-family:inherit;font-weight:500;}
.empty{text-align:center;padding:60px;color:#94a3b8;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:white;border-radius:16px;padding:32px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;}
.modal h2{font-size:1.25rem;font-weight:700;margin-bottom:24px;}
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:0.875rem;font-weight:500;margin-bottom:6px;}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:0.875rem;font-family:inherit;outline:none;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#2563eb;}
.fg textarea{min-height:220px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.modal-btns{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;}
.btn-cancel{background:#f1f5f9;color:#475569;padding:10px 20px;border-radius:8px;font-weight:600;font-size:0.875rem;cursor:pointer;border:none;font-family:inherit;}
.btn-save{background:#2563eb;color:white;padding:10px 20px;border-radius:8px;font-weight:600;font-size:0.875rem;cursor:pointer;border:none;font-family:inherit;}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:white;padding:12px 20px;border-radius:8px;font-size:0.875rem;display:none;z-index:200;}
.toast.show{display:block;}
@media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr);}.row2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="topbar">
<h1>Blog Admin – SalaryCalculator.my</h1>
<div><a href="/blog" target="_blank">View Blog</a><a href="/">Main Site</a></div>
</div>
<div class="container">
<div class="stats-row">
<div class="stat-card"><div class="stat-label">Total Articles</div><div class="stat-value" id="sTotal">–</div></div>
<div class="stat-card"><div class="stat-label">Published</div><div class="stat-value green" id="sPub">–</div></div>
<div class="stat-card"><div class="stat-label">Drafts</div><div class="stat-value amber" id="sDraft">–</div></div>
<div class="stat-card"><div class="stat-label">Categories</div><div class="stat-value" id="sCats">–</div></div>
</div>
<div class="toolbar">
<input type="text" class="search-input" id="searchInput" placeholder="Search articles..." oninput="filterPosts()">
<button class="btn-add" onclick="openModal()">+ Add New Article</button>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Date</th><th>Read Time</th><th>Actions</th></tr></thead>
<tbody id="tbody"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
</table>
</div>
</div>
<div class="overlay" id="overlay">
<div class="modal">
<h2 id="mTitle">Add New Article</h2>
<input type="hidden" id="eRow">
<div class="row2">
<div class="fg"><label>Title *</label><input type="text" id="fTitle" placeholder="Article title"></div>
<div class="fg"><label>Slug *</label><input type="text" id="fSlug" placeholder="article-slug"></div>
</div>
<div class="row2">
<div class="fg"><label>Category</label><select id="fCat"><option>EPF</option><option>PCB</option><option>SOCSO</option><option>Employment Law</option><option>Salary Tips</option><option>Minimum Wage</option></select></div>
<div class="fg"><label>Read Time (min)</label><input type="number" id="fTime" value="5" min="1"></div>
</div>
<div class="row2">
<div class="fg"><label>Date</label><input type="date" id="fDate"></div>
<div class="fg"><label>Status</label><select id="fStatus"><option value="published">Published</option><option value="draft">Draft</option></select></div>
</div>
<div class="fg"><label>Summary</label><input type="text" id="fSum" placeholder="Brief summary for blog listing"></div>
<div class="fg"><label>Meta Description (SEO)</label><input type="text" id="fMeta" placeholder="SEO description"></div>
<div class="fg"><label>Content (HTML allowed)</label><textarea id="fContent" placeholder="Write article here. Use &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;, &lt;table&gt; tags."></textarea></div>
<div class="modal-btns">
<button class="btn-cancel" onclick="closeModal()">Cancel</button>
<button class="btn-save" onclick="savePost()">Save Article</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var SU='https://script.google.com/macros/s/AKfycbyTPw8wCwuGBnyilrs76sF30miUCf1WreXe2ETKKzsaUXlECfquGMlw6juC7--XMu3YVg/exec';
var AP=[];
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}
function load(){
  fetch(SU+'?action=getPosts').then(function(r){return r.json();}).then(function(d){
    AP=d.posts||[];
    var pub=AP.filter(function(p){return p.status==='published';}).length;
    document.getElementById('sTotal').textContent=AP.length;
    document.getElementById('sPub').textContent=pub;
    document.getElementById('sDraft').textContent=AP.length-pub;
    document.getElementById('sCats').textContent=new Set(AP.map(function(p){return p.category;})).size;
    render(AP);
  }).catch(function(){document.getElementById('tbody').innerHTML='<tr><td colspan="6" class="empty">Failed to load.</td></tr>';});
}
function render(posts){
  var tb=document.getElementById('tbody');
  if(!posts.length){tb.innerHTML='<tr><td colspan="6" class="empty">No articles found.</td></tr>';return;}
  tb.innerHTML=posts.map(function(p){
    var b=p.status==='published'?'<span class="badge badge-pub">Published</span>':'<span class="badge badge-draft">Draft</span>';
    var d=p.date?new Date(p.date).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'}):'–';
    return '<tr><td><strong>'+p.title+'</strong><br><span style="color:#94a3b8;font-size:0.75rem;">/'+p.slug+'</span></td><td>'+p.category+'</td><td>'+b+'</td><td>'+d+'</td><td>'+p.readTime+' min</td><td><button class="btn-edit" onclick="edit('+p.row+')">Edit</button><button class="btn-del" onclick="del('+p.row+',this)">Delete</button></td></tr>';
  }).join('');}
function filterPosts(){var q=document.getElementById('searchInput').value.toLowerCase();render(AP.filter(function(p){return p.title.toLowerCase().includes(q)||p.category.toLowerCase().includes(q);}));}
function openModal(post){
  document.getElementById('mTitle').textContent=post?'Edit Article':'Add New Article';
  document.getElementById('eRow').value=post?post.row:'';
  document.getElementById('fTitle').value=post?post.title:'';
  document.getElementById('fSlug').value=post?post.slug:'';
  document.getElementById('fCat').value=post?post.category:'EPF';
  document.getElementById('fTime').value=post?post.readTime:5;
  document.getElementById('fDate').value=post&&post.date?String(post.date).substring(0,10):new Date().toISOString().substring(0,10);
  document.getElementById('fStatus').value=post?post.status:'draft';
  document.getElementById('fSum').value=post?post.summary:'';
  document.getElementById('fMeta').value=post?post.metaDesc:'';
  document.getElementById('fContent').value=post?post.content:'';
  document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
document.getElementById('fTitle').addEventListener('input',function(){if(!document.getElementById('eRow').value)document.getElementById('fSlug').value=this.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');});
function savePost(){
  var row=document.getElementById('eRow').value;
  var p={action:row?'updatePost':'addPost',row:row?parseInt(row):undefined,title:document.getElementById('fTitle').value.trim(),slug:document.getElementById('fSlug').value.trim(),category:document.getElementById('fCat').value,readTime:parseInt(document.getElementById('fTime').value)||5,date:document.getElementById('fDate').value,status:document.getElementById('fStatus').value,summary:document.getElementById('fSum').value.trim(),metaDesc:document.getElementById('fMeta').value.trim(),content:document.getElementById('fContent').value.trim()};
  if(!p.title||!p.slug){showToast('Title and slug required.');return;}
  fetch(SU,{method:'POST',body:JSON.stringify(p)}).then(function(r){return r.json();}).then(function(){closeModal();showToast(row?'Updated!':'Article added!');load();}).catch(function(){showToast('Error. Try again.');});}
function edit(row){var p=AP.find(function(x){return x.row===row;});if(p)openModal(p);}
function del(row,btn){
  var title=btn.closest('tr').querySelector('strong').textContent;
  if(!confirm('Delete "'+title+'"?'))return;
  fetch(SU,{method:'POST',body:JSON.stringify({action:'deletePost',row:row})}).then(function(r){return r.json();}).then(function(){showToast('Deleted!');load();}).catch(function(){showToast('Error.');});}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
load();
</script>
</body>
</html>
