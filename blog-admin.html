<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin | Salary Calculator</title>
    <!-- We can use the existing calculator styles or direct tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/calculator-styles.css" rel="stylesheet" />
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Blog Admin</h1>
                <p class="text-slate-500 mt-2">Manage articles loaded from Google Sheets</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                + Add New Article
            </button>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
                            <th class="p-4 font-semibold">Title</th>
                            <th class="p-4 font-semibold">Category</th>
                            <th class="p-4 font-semibold">Slug</th>
                            <th class="p-4 font-semibold">Date</th>
                            <th class="p-4 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="articles-table-body" class="divide-y divide-slate-100">
                        <!-- Articles will be loaded here -->
                        <tr>
                            <td colspan="5" class="p-8 text-center text-slate-500">
                                Loading articles from Google Sheets...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal (Hidden by default) -->
    <div id="article-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-slate-900 m-0">Add New Article</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6">
                <form id="article-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Title</label>
                        <input type="text" id="article-title" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                            <input type="text" id="article-category" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Slug</label>
                            <input type="text" id="article-slug" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Content (Markdown/HTML)</label>
                        <textarea id="article-content" rows="6" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" required></textarea>
                    </div>
                    <div class="pt-4 flex justify-end space-x-3">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition-colors">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save Article</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Example logic for Google Sheets integration
        const GOOGLE_SHEETS_API_URL = ''; // Add your Google Apps Script Web App URL here
        
        async function loadArticles() {
            const tbody = document.getElementById('articles-table-body');
            
            try {
                if (!GOOGLE_SHEETS_API_URL) {
                    // Mock data if no URL provided
                    const mockData = [
                        { id: 1, title: 'Malaysia Salary Guide 2026', category: 'Salary Tips', slug: 'malaysia-salary-guide-2026', date: '2026-06-23' },
                        { id: 2, title: 'EPF Contribution Rates', category: 'Compliance', slug: 'epf-contribution-guide-2026', date: '2026-06-20' },
                    ];
                    renderTable(mockData);
                    return;
                }

                const response = await fetch(GOOGLE_SHEETS_API_URL);
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Failed to load articles.</td></tr>`;
                console.error('Error loading articles:', error);
            }
        }

        function renderTable(articles) {
            const tbody = document.getElementById('articles-table-body');
            tbody.innerHTML = '';
            
            if (!articles || articles.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">No articles found.</td></tr>`;
                return;
            }

            articles.forEach(article => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-medium text-slate-900">${article.title}</td>
                    <td class="p-4 text-slate-600"><span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-medium">${article.category}</span></td>
                    <td class="p-4 text-slate-500 font-mono text-sm">${article.slug}</td>
                    <td class="p-4 text-slate-500">${article.date}</td>
                    <td class="p-4 text-right space-x-2">
                        <button onclick="editArticle(${article.id})" class="text-blue-600 hover:text-blue-800 text-sm font-medium">Edit</button>
                        <button onclick="deleteArticle(${article.id})" class="text-red-600 hover:text-red-800 text-sm font-medium">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal(isEdit = false) {
            document.getElementById('modal-title').textContent = isEdit ? 'Edit Article' : 'Add New Article';
            document.getElementById('article-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('article-modal').style.display = 'none';
            document.getElementById('article-form').reset();
        }

        function editArticle(id) {
            openModal(true);
            // In a real app, you would fetch the article details and populate the form
            console.log('Editing article', id);
        }

        function deleteArticle(id) {
            if (confirm('Are you sure you want to delete this article?')) {
                console.log('Deleting article', id);
                // In a real app, you would call the API to delete
                loadArticles(); // Reload table
            }
        }

        document.getElementById('article-form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Saving article...');
            // In a real app, you would call the API to save/update
            closeModal();
            loadArticles(); // Reload table
        });

        // Initialize
        loadArticles();
    </script>
</body>
</html>
