<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Admin – SalaryCalculator.my</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;}
.topbar{background:#1e293b;color:white;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;}
.topbar h1{font-size:1.125rem;font-weight:600;}
.topbar a{color:#94a3b8;text-decoration:none;font-size:0.875rem;}
.container{max-width:1200px;margin:0 auto;padding:32px 24px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px;}
.stat-card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:20px 24px;}
.stat-label{font-size:0.75rem;font-weight:600;text-transform:uppercase;color:#64748b;margin-bottom:8px;}
.stat-value{font-size:2rem;font-weight:700;color:#0f172a;}
.stat-value.green{color:#16a34a;} .stat-value.amber{color:#d97706;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:16px;}
.search-input{border:1px solid #e2e8f0;border-radius:8px;padding:10px 16px;font-size:0.875rem;width:300px;outline:none;font-family:inherit;}
.search-input:focus{border-color:#2563eb;}
.btn{padding:10px 20px;border-radius:8px;font-weight:600;font-size:0.875rem;cursor:pointer;border:none;font-family:inherit;}
.btn-primary{background:#2563eb;color:white;}
.btn-danger{background:#fee2e2;color:#b91c1c;padding:6px 12px;font-size:0.8rem;}
.btn-edit{background:#eff6ff;color:#2563eb;padding:6px 12px;font-size:0.8rem;}
.table-wrap{background:white;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead tr{background:#f8fafc;}
th{padding:12px 16px;text-align:left;font-size:0.75rem;font-weight:600;text-transform:uppercase;color:#64748b;border-bottom:1px solid #e2e8f0;}
td{padding:14px 16px;border-bottom:1px solid #f1f5f9;font-size:0.875rem;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600;}
.badge-pub{background:#dcfce7;color:#16a34a;} .badge-draft{background:#fef9c3;color:#a16207;}
.actions{display:flex;gap:8px;}
.empty{text-align:center;padding:60px;color:#94a3b8;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:16px;padding:32px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;}
.modal h2{font-size:1.25rem;font-weight:700;margin-bottom:24px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:0.875rem;font-weight:500;margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:0.875rem;font-family:inherit;outline:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#2563eb;}
.form-group textarea{min-height:220px;resize:vertical;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;}
.btn-cancel{background:#f1f5f9;color:#475569;padding:10px 20px;border-radius:8px;font-weight:600;font-size:0.875rem;cursor:pointer;border:none;font-family:inherit;}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:white;padding:12px 20px;border-radius:8px;font-size:0.875rem;display:none;z-index:200;}
.toast.show{display:block;}
</style>
</head>
<body>
<div class="topbar">
<h1>Blog Admin – SalaryCalculator.my</h1>
<div style="display:flex;gap:20px;"><a href="/blog" target="_blank">View Blog</a><a href="/">Main Site</a></div>
</div>
<div class="container">
<div class="stats-row">
<div class="stat-card"><div class="stat-label">Total Articles</div><div class="stat-value" id="statTotal">–</div></div>
<div class="stat-card"><div class="stat-label">Published</div><div class="stat-value green" id="statPub">–</div></div>
<div class="stat-card"><div class="stat-label">Drafts</div><div class="stat-value amber" id="statDraft">–</div></div>
<div class="stat-card"><div class="stat-label">Categories</div><div class="stat-value" id="statCats">–</div></div>
</div>
<div class="toolbar">
<input type="text" class="search-input" id="searchInput" placeholder="Search articles..." oninput="filterPosts()">
<button class="btn btn-primary" onclick="openModal()">+ Add New Article</button>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Date</th><th>Min Read</th><th>Actions</th></tr></thead>
<tbody id="postsTable"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
</table>
</div>
</div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2 id="modalTitle">Add New Article</h2>
<input type="hidden" id="editRow">
<div class="form-row">
<div class="form-group"><label>Title *</label><input type="text" id="fTitle" placeholder="Article title"></div>
<div class="form-group"><label>Slug *</label><input type="text" id="fSlug" placeholder="article-slug"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Category</label><select id="fCategory"><option>EPF</option><option>PCB</option><option>SOCSO</option><option>Employment Law</option><option>Salary Tips</option><option>Minimum Wage</option></select></div>
<div class="form-group"><label>Read Time (min)</label><input type="number" id="fReadTime" value="5" min="1"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Date</label><input type="date" id="fDate"></div>
<div class="form-group"><label>Status</label><select id="fStatus"><option value="published">Published</option><option value="draft">Draft</option></select></div>
</div>
<div class="form-group"><label>Summary (shown on blog listing)</label><input type="text" id="fSummary" placeholder="Brief summary"></div>
<div class="form-group"><label>Meta Description (SEO)</label><input type="text" id="fMetaDesc" placeholder="SEO description"></div>
<div class="form-group"><label>Article Content (HTML allowed)</label><textarea id="fContent" placeholder="Write article here. Use &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;, &lt;table&gt; tags."></textarea></div>
<div class="modal-actions">
<button class="btn-cancel" onclick="closeModal()">Cancel</button>
<button class="btn btn-primary" onclick="savePost()">Save Article</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var SU='https://script.google.com/macros/s/AKfycbyTPw8wCwuGBnyilrs76sF30miUCf1WreXe2ETKKzsaUXlECfquGMlw6juC7--XMu3YVg/exec';
var allPosts=[];
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},3000);}
function loadPosts(){
fetch(SU+'?action=getPosts').then(function(r){return r.json();}).then(function(d){
allPosts=d.posts||[];
var pub=allPosts.filter(function(p){return p.status==='published';}).length;
var draft=allPosts.length-pub;
var cats=new Set(allPosts.map(function(p){return p.category;})).size;
document.getElementById('statTotal').textContent=allPosts.length;
document.getElementById('statPub').textContent=pub;
document.getElementById('statDraft').textContent=draft;
document.getElementById('statCats').textContent=cats;
renderTable(allPosts);
}).catch(function(){document.getElementById('postsTable').innerHTML='<tr><td colspan="6" class="empty">Failed to load. Check connection.</td></tr>';});}
function renderTable(posts){
var tb=document.getElementById('postsTable');
if(!posts.length){tb.innerHTML='<tr><td colspan="6" class="empty">No articles found.</td></tr>';return;}
tb.innerHTML=posts.map(function(p){
var b=p.status==='published'?'<span class="badge badge-pub">Published</span>':'<span class="badge badge-draft">Draft</span>';
feat: add blog admin dashboard with article managementreturn '<tr><td><strong>'+p.title+'</strong><br><span style="color:#94a3b8;font-size:0.75rem;">/'+p.slug+'</span></td><td>'+p.category+'</td><td>'+b+'</td><td>'+d+'</td><td>'+p.readTime+' min</td><td><div class="actions"><button class="btn btn-edit" onclick="editPost('+p.row+')">Edit</button><button class="btn btn-danger" onclick="delPost('+p.row+',this)">Delete</button></div></td></tr>';
}).join('');}
function filterPosts(){var q=document.getElementById('searchInput').value.toLowerCase();renderTable(allPosts.filter(function(p){return p.title.toLowerCase().includes(q)||p.category.toLowerCase().includes(q);}));}
function openModal(post){
document.getElementById('modalTitle').textContent=post?'Edit Article':'Add New Article';
document.getElementById('editRow').value=post?post.row:'';
document.getElementById('fTitle').value=post?post.title:'';
document.getElementById('fSlug').value=post?post.slug:'';
document.getElementById('fCategory').value=post?post.category:'EPF';
document.getElementById('fReadTime').value=post?post.readTime:5;
document.getElementById('fDate').value=post&&post.date?String(post.date).substring(0,10):new Date().toISOString().substring(0,10);
document.getElementById('fStatus').value=post?post.status:'draft';
document.getElementById('fSummary').value=post?post.summary:'';
document.getElementById('fMetaDesc').value=post?post.metaDesc:'';
document.getElementById('fContent').value=post?post.content:'';
document.getElementById('modalOverlay').classList.add('open');}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
document.getElementById('fTitle').addEventListener('input',function(){if(!document.getElementById('editRow').value)document.getElementById('fSlug').value=this.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');});
function savePost(){
var row=document.getElementById('editRow').value;
var payload={action:row?'updatePost':'addPost',row:row?parseInt(row):undefined,title:document.getElementById('fTitle').value.trim(),slug:document.getElementById('fSlug').value.trim(),category:document.getElementById('fCategory').value,readTime:parseInt(document.getElementById('fReadTime').value)||5,date:document.getElementById('fDate').value,status:document.getElementById('fStatus').value,summary:document.getElementById('fSummary').value.trim(),metaDesc:document.getElementById('fMetaDesc').value.trim(),content:document.getElementById('fContent').value.trim()};
if(!payload.title||!payload.slug){toast('Title and slug are required.');return;}
fetch(SU,{method:'POST',body:JSON.stringify(payload)}).then(function(r){return r.json();}).then(function(){closeModal();toast(row?'Article updated!':'Article added!');loadPosts();}).catch(function(){toast('Error saving. Try again.');});}
function editPost(row){var p=allPosts.find(function(x){return x.row===row;});if(p)openModal(p);}
function delPost(row,btn){
var title=btn.closest('tr').querySelector('strong').textContent;
if(!confirm('Delete "'+title+'"?'))return;
fetch(SU,{method:'POST',body:JSON.stringify({action:'deletePost',row:row})}).then(function(r){return r.json();}).then(function(){toast('Deleted!');loadPosts();}).catch(function(){toast('Error deleting.');});}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
loadPosts();
</script>
</body></html>
