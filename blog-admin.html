<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Admin - SalaryCalculator.my</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased">
<div id="toast" class="hidden fixed bottom-6 right-6 px-5 py-3 rounded-xl text-white text-sm font-medium shadow-xl z-50"></div>
<div id="loginWrap" class="min-h-screen flex items-center justify-center p-4"><div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 p-8"><div class="text-center mb-8"><img src="/logo-small.png" alt="SalaryCalc MY" class="h-8 mx-auto mb-4" onerror="this.style.display='none'"><h1 class="text-2xl font-bold text-slate-900">Blog Admin</h1><p class="text-slate-500 text-sm mt-1">Sign in with lavtania@epicareer.com</p></div><form id="loginForm" class="space-y-4"><div><label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label><input id="loginEmail" type="email" value="lavtania@epicareer.com" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></div><div><label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label><input id="loginPass" type="password" placeholder="Your password" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></div><p id="loginErr" class="hidden text-red-500 text-sm"></p><button id="loginBtn" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium text-sm">Sign In</button></form></div></div>
<div id="adminWrap" class="hidden min-h-screen"><header class="bg-white border-b border-slate-200 sticky top-0 z-30"><div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between"><div class="flex items-center gap-3"><img src="/logo-small.png" alt="SalaryCalc MY" class="h-6" onerror="this.style.display='none'"><span class="text-slate-300">|</span><span class="text-sm font-semibold text-slate-700">Blog Admin</span></div><div class="flex items-center gap-4"><span id="userEmail" class="text-xs text-slate-500 hidden sm:block"></span><a href="/blog" target="_blank" class="text-xs text-slate-500 hover:text-slate-800">View Blog</a><button id="logoutBtn" class="text-xs border border-slate-300 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-50">Sign Out</button></div></div></header>
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-8"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6"><div><h1 class="text-2xl font-bold text-slate-900">Articles</h1><p class="text-slate-500 text-sm mt-0.5">Manage and publish blog content</p></div><button id="newPostBtn" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm shadow-sm"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>New Article</button></div>
<div class="flex flex-col sm:flex-row gap-3 mb-4"><div class="relative flex-1 max-w-sm"><svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="searchInput" type="search" placeholder="Search articles..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></div><select id="catFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none"><option value="">All categories</option><option>EPF</option><option>PCB</option><option>SOCSO</option><option>Employment Law</option><option>Salary Tips</option></select></div>
<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden"><table class="w-full text-left text-sm"><thead class="bg-slate-50 border-b border-slate-200"><tr class="text-slate-500 text-xs font-semibold uppercase tracking-wide"><th class="px-4 py-3">Title</th><th class="px-4 py-3">Category</th><th class="px-4 py-3">Slug</th><th class="px-4 py-3">Date</th><th class="px-4 py-3">Status</th><th class="px-4 py-3 text-right">Actions</th></tr></thead><tbody id="tableBody" class="divide-y divide-slate-100"><tr><td colspan="6" class="py-10 text-center text-slate-400">Loading...</td></tr></tbody></table></div></main></div>
<div id="modalOverlay" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col"><div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 flex-shrink-0"><h2 id="modalTitle" class="text-lg font-bold text-slate-900">New Article</h2><button id="modalClose" class="text-slate-400 hover:text-slate-600 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg></button></div>
<form id="postForm" class="flex-1 overflow-y-auto px-6 py-5 space-y-5">
<div><label class="block text-sm font-medium text-slate-700 mb-1.5">Title *</label><input id="fTitle" type="text" placeholder="e.g. EPF Contribution Rates 2026" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-slate-700 mb-1.5">Slug * (auto-generated)</label><input id="fSlug" type="text" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none"></div><div><label class="block text-sm font-medium text-slate-700 mb-1.5">Category</label><select id="fCategory" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"><option value="">Select category</option><option>EPF</option><option>PCB</option><option>SOCSO</option><option>Employment Law</option><option>Salary Tips</option></select></div></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1.5">Excerpt</label><textarea id="fExcerpt" rows="2" placeholder="Short summary 150-160 chars..." class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea></div>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4"><div class="sm:col-span-2"><label class="block text-sm font-medium text-slate-700 mb-1.5">Featured Image URL</label><input id="fThumb" type="url" placeholder="https://..." class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></div><div><label class="block text-sm font-medium text-slate-700 mb-1.5">Read time (min)</label><input id="fReadTime" type="number" min="1" max="60" placeholder="5" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></div></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1.5">Meta Description (SEO)</label><input id="fMetaDesc" type="text" placeholder="SEO meta description..." class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-slate-700 mb-1.5">Status</label><select id="fStatus" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"><option value="draft">Draft</option><option value="published">Published</option></select></div><div><label class="block text-sm font-medium text-slate-700 mb-1.5">Publish Date</label><input id="fDate" type="date" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></div></div>
<div><label class="block text-sm font-medium text-slate-700 mb-1.5">Content (HTML) * - use h2, p, ul, table tags</label><textarea id="fContent" rows="14" required placeholder="Write article HTML here..." class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm font-mono focus:ring-2 focus:ring-blue-500 outline-none resize-y"></textarea></div>
<p id="saveErr" class="hidden text-red-500 text-sm"></p>
</form>
<div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-100 flex-shrink-0"><button id="cancelBtn" type="button" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button><button id="saveBtn" type="submit" form="postForm" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium shadow-sm">Save Article</button></div>
</div></div>
<script>
(async function() {
  var FB_CDN = 'https://www.gstatic.com/firebasejs/10.12.0/';
  var cfg = { apiKey:"AIzaSyAT1xtn2fSPbxUrIyJvK_r449D_WB6Ete8", authDomain:"gen-lang-client-0273291777.firebaseapp.com", projectId:"gen-lang-client-0273291777", storageBucket:"gen-lang-client-0273291777.firebasestorage.app", messagingSenderId:"235978759653", appId:"1:235978759653:web:fb82260c62f98fc80ce30c" };
  var FB_DB_ID = "ai-studio-f7c7f3ec-1f6a-45a9-a332-4733fe85d918";
  var App = await import(FB_CDN + 'firebase-app.js');
  var Auth = await import(FB_CDN + 'firebase-auth.js');
  var Store = await import(FB_CDN + 'firebase-firestore.js');
  var app = App.initializeApp(cfg);
  var auth = Auth.getAuth(app);
  var db = Store.getFirestore(app, FB_DB_ID);
  var COLL = 'blog_posts';
  var show = function(id){ $(id).classList.remove('hidden'); };
  var hide = function(id){ $(id).classList.add('hidden'); };
  var toast = function(msg, ok) { var t=$('toast'); t.textContent=msg; t.className='fixed bottom-6 right-6 px-5 py-3 rounded-xl text-white text-sm font-medium shadow-xl z-50 '+(ok!==false?'bg-green-600':'bg-red-500'); t.classList.remove('hidden'); setTimeout(function(){ t.classList.add('hidden'); },3000); };
  var editingId = null, allPosts = [];
  Auth.onAuthStateChanged(auth, function(user) { if(user){ hide('loginWrap'); show('adminWrap'); $('userEmail').textContent=user.email; loadPosts(); } else { show('loginWrap'); hide('adminWrap'); } });
  $('loginForm').addEventListener('submit', async function(e) { e.preventDefault(); var btn=$('loginBtn'); btn.textContent='Signing in...'; btn.disabled=true; try{ await Auth.signInWithEmailAndPassword(auth,$('loginEmail').value.trim(),$('loginPass').value); }catch(err){ $('loginErr').textContent='Invalid email or password.'; show('loginErr'); btn.textContent='Sign In'; btn.disabled=false; } });
  $('logoutBtn').addEventListener('click', function(){ Auth.signOut(auth); });
  async function loadPosts() { $('tableBody').innerHTML='<tr><td colspan="6" class="py-10 text-center text-slate-400">Loading...</td></tr>'; try{ var q=Store.query(Store.collection(db,COLL),Store.orderBy('createdAt','desc')); var snap=await Store.getDocs(q); allPosts=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }); renderTable(allPosts); }catch(err){ $('tableBody').innerHTML='<tr><td colspan="6" class="py-10 text-center text-red-500">'+err.message+'</td></tr>'; } }
  function renderTable(posts) { if(!posts.length){ $('tableBody').innerHTML='<tr><td colspan="6" class="py-10 text-center text-slate-400">No articles yet.</td></tr>'; return; } $('tableBody').innerHTML=posts.map(function(p){ var date=p.publishedAt?new Date(p.publishedAt).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'}):'-'; var badge=p.status==='published'?'<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-700">Published</span>':' <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-700">Draft</span>'; return '<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium text-slate-900 max-w-xs truncate">'+(p.title||'-')+'</td><td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-700">'+(p.category||'-')+'</span></td><td class="px-4 py-3 font-mono text-xs text-slate-500">'+(p.slug||'-')+'</td><td class="px-4 py-3 text-sm text-slate-500">'+date+'</td><td class="px-4 py-3">'+badge+'</td><td class="px-4 py-3 text-right space-x-3"><button onclick="window._edit(\''+(p.id)+'\')" class="text-blue-600 text-sm font-medium">Edit</button> <button onclick="window._del(\''+(p.id)+'\',\''+(p.title||'').replace(/\'/g,'\\\'')+'\')" class="text-red-500 text-sm font-medium">Delete</button></td></tr>'; }).join(''); }
  $('searchInput').addEventListener('input',function(e){ var q=e.target.value.toLowerCase(); renderTable(allPosts.filter(function(p){ return (p.title||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q)||(p.slug||'').toLowerCase().includes(q); })); });
  $('catFilter').addEventListener('change',function(e){ var cat=e.target.value; renderTable(cat?allPosts.filter(function(p){return p.category===cat;}):allPosts); });
  $('newPostBtn').addEventListener('click',function(){ openModal(); });
  $('modalClose').addEventListener('click',closeModal);
  $('cancelBtn').addEventListener('click',closeModal);
  $('modalOverlay').addEventListener('click',function(e){ if(e.target===$('modalOverlay')) closeModal(); });
  function openModal(post) { editingId=post?post.id:null; $('modalTitle').textContent=post?'Edit Article':'New Article'; $('fTitle').value=post&&post.title||''; $('fSlug').value=post&&post.slug||''; $('fCategory').value=post&&post.category||''; $('fExcerpt').value=post&&post.excerpt||''; $('fThumb').value=post&&post.thumbnail||''; $('fReadTime').value=post&&post.readTime||''; $('fMetaDesc').value=post&&post.metaDesc||''; $('fStatus').value=post&&post.status||'draft'; $('fDate').value=post&&post.publishedAt?post.publishedAt.substring(0,10):new Date().toISOString().substring(0,10); $('fContent').value=post&&post.content||''; $('saveErr').classList.add('hidden'); $('modalOverlay').classList.remove('hidden'); $('modalOverlay').classList.add('flex'); setTimeout(function(){ $('fTitle').focus(); },50); }
  function closeModal() { $('modalOverlay').classList.add('hidden'); $('modalOverlay').classList.remove('flex'); editingId=null; }
  $('fTitle').addEventListener('input',function(){ if(!editingId) $('fSlug').value=$('fTitle').value.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-'); });
  $('postForm').addEventListener('submit', async function(e) { e.preventDefault(); var saveBtn=$('saveBtn'); saveBtn.textContent='Saving...'; saveBtn.disabled=true; var data={title:$('fTitle').value.trim(),slug:$('fSlug').value.trim(),category:$('fCategory').value.trim(),excerpt:$('fExcerpt').value.trim(),thumbnail:$('fThumb').value.trim(),readTime:parseInt($('fReadTime').value)||5,metaDesc:$('fMetaDesc').value.trim(),status:$('fStatus').value,publishedAt:$('fDate').value,content:$('fContent').value.trim(),updatedAt:Store.serverTimestamp()}; if(!data.title||!data.slug||!data.content){ $('saveErr').textContent='Title, slug and content are required.'; $('saveErr').classList.remove('hidden'); saveBtn.textContent='Save Article'; saveBtn.disabled=false; return; } try{ if(editingId){ await Store.updateDoc(Store.doc(db,COLL,editingId),data); toast('Article updated'); }else{ data.createdAt=Store.serverTimestamp(); await Store.addDoc(Store.collection(db,COLL),data); toast('Article published'); } closeModal(); await loadPosts(); }catch(err){ $('saveErr').textContent=err.message; $('saveErr').classList.remove('hidden'); toast(err.message,false); } saveBtn.textContent='Save Article'; saveBtn.disabled=false; });
  window._edit = async function(id) { var snap=await Store.getDoc(Store.doc(db,COLL,id)); if(snap.exists()) openModal(Object.assign({id:snap.id},snap.data())); };
  window._del = async function(id,title) { if(!confirm('Delete "'+title+'"? Cannot be undone.')) return; try{ await Store.deleteDoc(Store.doc(db,COLL,id)); toast('Article deleted'); await loadPosts(); }catch(err){ toast(err.message,false); } };
})();
</script>
</body>
</html>
