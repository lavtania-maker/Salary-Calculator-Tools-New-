<!-- Modified for Table Module and Paste Support -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Admin - SalaryCalculator.my</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f6fa;
        color: #1a1d23;
        min-height: 100vh;
        font-size: 14px;
        line-height: 1.6;
      }
      #loginWrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
        padding: 20px;
      }
      .login-card {
        background: #fff;
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      .login-logo {
        display: block;
        margin: 0 auto 24px;
        height: 36px;
        width: auto;
      }
      .login-card h1 {
        font-size: 22px;
        font-weight: 700;
        color: #0f172a;
        text-align: center;
        margin-bottom: 4px;
      }
      .login-card p {
        text-align: center;
        color: #64748b;
        font-size: 13px;
        margin-bottom: 28px;
      }
      .field-group {
        margin-bottom: 16px;
      }
      .field-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .field-group input {
        width: 100%;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
      }
      .field-group input:focus {
        border-color: #2563eb;
      }
      #loginErr {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 12px;
        display: none;
      }
      .btn-primary {
        width: 100%;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #adminWrap {
        display: none;
        flex-direction: column;
        min-height: 100vh;
      }
      .admin-header {
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        position: sticky;
        top: 0;
        z-index: 50;
        gap: 12px;
      }
      .admin-header img {
        height: 28px;
        width: auto;
      }
      .header-sep {
        color: #cbd5e1;
        font-size: 18px;
      }
      .header-title {
        font-size: 13px;
        font-weight: 600;
        color: #374151;
      }
      .header-spacer {
        flex: 1;
      }
      .header-email {
        font-size: 12px;
        color: #94a3b8;
      }
      .btn-link {
        background: none;
        border: 1.5px solid #e2e8f0;
        color: #374151;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.12s;
      }
      .btn-link:hover {
        background: #f8fafc;
      }
      .admin-main {
        flex: 1;
        padding: 28px 24px;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
      }
      .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 24px;
        gap: 12px;
        flex-wrap: wrap;
      }
      .page-header h1 {
        font-size: 22px;
        font-weight: 700;
        color: #0f172a;
      }
      .page-header p {
        font-size: 13px;
        color: #64748b;
        margin-top: 2px;
      }
      .btn-new {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .btn-new:hover {
        background: #1d4ed8;
      }
      .filters {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .search-wrap {
        position: relative;
        flex: 1;
        min-width: 200px;
        max-width: 320px;
      }
      .search-wrap svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 15px;
        height: 15px;
        color: #94a3b8;
        pointer-events: none;
      }
      .search-wrap input {
        width: 100%;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px 12px 8px 34px;
        font-size: 13px;
        outline: none;
        background: #fff;
        transition: border-color 0.15s;
      }
      .search-wrap input:focus {
        border-color: #2563eb;
      }
      select.filter-select {
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        background: #fff;
        outline: none;
        color: #374151;
        cursor: pointer;
      }
      .table-card {
        background: #fff;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead {
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
      }
      thead th {
        padding: 12px 16px;
        text-align: left;
        font-size: 11px;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      tbody tr {
        border-bottom: 1px solid #f1f5f9;
        transition: background 0.1s;
      }
      tbody tr:last-child {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #fafbff;
      }
      tbody td {
        padding: 14px 16px;
        vertical-align: middle;
      }
      .td-title {
        font-weight: 600;
        color: #0f172a;
        max-width: 260px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .td-slug {
        font-family: monospace;
        font-size: 11px;
        color: #94a3b8;
      }
      .td-date {
        color: #64748b;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
      }
      .badge-pub {
        background: #dcfce7;
        color: #15803d;
      }
      .badge-draft {
        background: #fef9c3;
        color: #a16207;
      }
      .badge-cat {
        background: #dbeafe;
        color: #1d4ed8;
      }
      .td-act {
        text-align: right;
        white-space: nowrap;
      }
      .btn-edit {
        background: none;
        border: none;
        color: #2563eb;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 5px;
      }
      .btn-edit:hover {
        background: #eff6ff;
      }
      .btn-del {
        background: none;
        border: none;
        color: #ef4444;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 5px;
      }
      .btn-del:hover {
        background: #fef2f2;
      }
      .empty-row {
        text-align: center;
        padding: 60px 20px;
        color: #94a3b8;
      }
      #modalOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      #modalOverlay.open {
        display: flex;
      }
      .modal {
        background: #fff;
        border-radius: 16px;
        width: 95%;
        max-width: 1100px;
        height: 93vh;
        max-height: 93vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        border-bottom: 1px solid #f1f5f9;
        flex-shrink: 0;
      }
      .modal-head h2 {
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
      }
      .modal-close {
        background: none;
        border: none;
        cursor: pointer;
        color: #94a3b8;
        padding: 4px;
        border-radius: 6px;
        display: flex;
        align-items: center;
      }
      .modal-body {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .form-field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .form-field input,
      .form-field select,
      .form-field textarea {
        width: 100%;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        transition: border-color 0.15s;
        background: #fff;
        color: #0f172a;
      }
      .form-field input:focus,
      .form-field select:focus,
      .form-field textarea:focus {
        border-color: #2563eb;
      }
      .form-field textarea {
        resize: vertical;
        min-height: 80px;
      }
      .hint {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 4px;
      }
      #saveErr {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        display: none;
      }
      .modal-foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        padding: 16px 24px;
        border-top: 1px solid #f1f5f9;
        flex-shrink: 0;
      }
      .btn-cancel {
        background: #fff;
        border: 1.5px solid #e2e8f0;
        color: #374151;
        border-radius: 8px;
        padding: 9px 18px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-save {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 22px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-save:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        z-index: 200;
        display: none;
      }
      .tok {
        background: #16a34a;
      }
      .tok-err {
        background: #dc2626;
      }
      .ql-toolbar.ql-snow {
        border: 1.5px solid #e2e8f0;
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        background: #f8fafc;
      }
      .ql-container.ql-snow {
        border: 1.5px solid #e2e8f0;
        border-radius: 0 0 8px 8px;
        font-family: inherit;
        font-size: 13px;
      }
      .ql-editor {
        min-height: 450px;
      }
      /* Table styles in editor */
      .ql-editor table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 1rem;
      }
      .ql-editor td, .ql-editor th {
        border: 1px solid #cbd5e1 !important;
        padding: 8px 12px !important;
        min-width: 20px;
      }
      /* quill-table-better overrides */
      .ql-table-better-container {
        margin: 10px 0;
      }
      @media (max-width: 640px) {
        .form-row {
          grid-template-columns: 1fr;
        }
        .admin-header {
          padding: 0 16px;
        }
        .admin-main {
          padding: 20px 16px;
        }
      }
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/quill-table-better@1.1.2/dist/quill-table-better.css" rel="stylesheet" />
  
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Main Stylesheet -->
    <link rel="preload" href="/calculator-styles.css" as="style" />
    <link href="/calculator-styles.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="/calculator-styles.css" rel="stylesheet" />
    </noscript>
</head>
  <body>
    <noscript>
      <div style="background:#fef2f2;border-bottom:1px solid #fecaca;padding:12px 20px;text-align:center;font-family:inherit;font-size: 15px;color:#dc2626;font-weight:600;">
        JavaScript is required to use the blog admin dashboard. Please enable JavaScript in your browser settings.
      </div>
    </noscript>
    <div id="toast"></div>
    <div id="loginWrap">
      <div class="login-card">
        <img
          src="/logo-small.png"
          alt="SalaryCalculator.my"
          class="login-logo"
          onerror="this.style.display = 'none'"
        />
        <h1>Blog Admin</h1>
        <p>Sign in to manage articles</p>
        <div id="loginErr"></div>
        <form id="loginForm">
          <div class="field-group">
            <label>Email</label
            ><input
              id="lEmail"
              type="email"
              value="blog-admin@salarycalculator.my"
              required
              autocomplete="email"
            />
          </div>
          <div class="field-group">
            <label>Password</label
            ><input
              id="lPass"
              type="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>
          <button class="btn-primary" id="loginBtn" type="submit">
            Sign In
          </button>
        </form>
      </div>
    </div>
    <div id="adminWrap">
      <header class="admin-header">
        <img
          src="/logo-small.png"
          alt="SalaryCalc MY"
          onerror="this.style.display = 'none'"
        />
        <span class="header-sep">|</span>
        <span class="header-title">Blog Admin</span>
        <span class="header-spacer"></span>
        <span class="header-email" id="userEmail"></span>
        <a href="/blog" target="_blank" class="btn-link">View Blog</a>
        <button class="btn-link" id="logoutBtn">Sign Out</button>
      </header>
      <main class="admin-main">
        <div class="page-header">
          <div>
            <h1>Articles</h1>
            <p>Manage and publish blog content</p>
          </div>
          <button class="btn-new" id="newPostBtn">+ New Article</button>
        </div>
        <div class="filters">
          <div class="search-wrap">
            <svg
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="Search articles..."
            />
          </div>
          <select id="catFilter" class="filter-select">
            <option value="">All categories</option>
            <option value="salary">Salary</option>
            <option value="epf">EPF</option>
            <option value="socso">SOCSO</option>
            <option value="pcb-income-tax">PCB / Income Tax</option>
            <option value="annual-leave">Annual Leave</option>
          </select>
        </div>
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Slug</th>
                <th>Date</th>
                <th>Status</th>
                <th style="text-align: right">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="6" class="empty-row">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
    <div id="modalOverlay">
      <div class="modal">
        <div class="modal-head">
          <h2 id="modalTitle">New Article</h2>
          <button class="modal-close" id="modalClose">&#x2715;</button>
        </div>
        <div class="modal-body">
          <div class="form-field">
            <label>Title *</label
            ><input
              id="fTitle"
              type="text"
              placeholder="e.g. EPF Contribution Rates 2026"
            />
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Slug *</label
              ><input
                id="fSlug"
                type="text"
                style="font-family: monospace; font-size: 12px"
                placeholder="auto-generated"
              />
              <div class="hint">URL: /blog/your-slug</div>
            </div>
            <div class="form-field">
              <label>Category</label
              ><select id="fCategory">
                <option value="">Select...</option>
                <option value="salary">Salary</option>
                <option value="epf">EPF</option>
                <option value="socso">SOCSO</option>
                <option value="pcb-income-tax">PCB / Income Tax</option>
                <option value="annual-leave">Annual Leave</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Featured Image URL</label
              ><input id="fThumb" type="url" placeholder="https://..." />
            </div>
            <div class="form-field">
              <label>Read Time (min)</label
              ><input
                id="fReadTime"
                type="number"
                min="1"
                max="60"
                placeholder="5"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Excerpt</label
              ><textarea
                id="fExcerpt"
                rows="2"
                placeholder="Short summary..."
              ></textarea>
            </div>
            <div class="form-field">
              <label>Meta Description (SEO)</label
              ><textarea
                id="fMetaDesc"
                rows="2"
                placeholder="150-160 chars for search engines..."
              ></textarea>
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Status</label
              ><select id="fStatus">
                <option value="draft">Draft</option>
                <option value="published">Published</option>
              </select>
            </div>
            <div class="form-field">
              <label>Publish Date</label><input id="fDate" type="date" />
            </div>
          </div>
          <div class="form-field">
            <label>Read More URL <span class="helper-text">(Optional)</span></label
            ><input id="fReadMore" type="url" placeholder="https://..." />
          </div>
          <div class="form-field">
            <label>Content *</label>
            <div id="editor-container" style="background: #fff"></div>
            <input type="hidden" id="fContent" />
          </div>
          <div id="saveErr"></div>
        </div>
        <div class="modal-foot">
          <button class="btn-cancel" id="cancelBtn">Cancel</button>
          <button class="btn-save" id="saveBtn">Save Article</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-table-better@1.1.2/dist/quill-table-better.js"></script>

          authDomain: "gen-lang-client-0273291777.firebaseapp.com",
          projectId: "gen-lang-client-0273291777",
          storageBucket: "gen-lang-client-0273291777.firebasestorage.app",
          messagingSenderId: "235978759653",
          appId: "1:235978759653:web:fb82260c62f98fc80ce30c",
        };
        var DB_ID = "ai-studio-f7c7f3ec-1f6a-45a9-a332-4733fe85d918";
        var COLL = "blog_posts";
        var App = await import(FB + "firebase-app.js");
        var Auth = await import(FB + "firebase-auth.js");
        var FS = await import(FB + "firebase-firestore.js");
        var app = App.initializeApp(cfg);
        var auth = Auth.getAuth(app);
        var db = FS.getFirestore(app, DB_ID);
        var G = function (id) {
          return document.getElementById(id);
        };
        var allPosts = [],
          editingId = null;
        function toast(msg, ok) {
          var t = G("toast");
          t.textContent = msg;
          t.className = ok === false ? "tok-err" : "tok";
          t.style.display = "block";
          clearTimeout(t._t);
          t._t = setTimeout(function () {
            t.style.display = "none";
          }, 3000);
        }
        Auth.onAuthStateChanged(auth, function (user) {
          if (user) {
            G("loginWrap").style.display = "none";
            G("adminWrap").style.display = "flex";
            G("userEmail").textContent = user.email;
            loadPosts();
          } else {
            G("loginWrap").style.display = "flex";
            G("adminWrap").style.display = "none";
          }
        });
        G("loginForm").addEventListener("submit", async function (e) {
          e.preventDefault();
          var btn = G("loginBtn"),
            err = G("loginErr");
          btn.textContent = "Signing in...";
          btn.disabled = true;
          err.style.display = "none";
          try {
            await Auth.signInWithEmailAndPassword(
              auth,
              G("lEmail").value.trim(),
              G("lPass").value,
            );
          } catch (ex) {
            err.textContent = "Incorrect email or password.";
            err.style.display = "block";
            btn.textContent = "Sign In";
            btn.disabled = false;
          }
        });
        G("logoutBtn").addEventListener("click", function () {
          Auth.signOut(auth);
        });
        async function loadPosts() {
          G("tableBody").innerHTML =
            '<tr><td colspan="6" class="empty-row">Loading...</td></tr>';
          try {
            var q = FS.query(
              FS.collection(db, COLL),
              FS.orderBy("createdAt", "desc"),
            );
            var snap = await FS.getDocs(q);
            allPosts = snap.docs.map(function (d) {
              return Object.assign({ id: d.id }, d.data());
            });
            renderTable(allPosts);
          } catch (ex) {
            G("tableBody").innerHTML =
              '<tr><td colspan="6" class="empty-row" style="color:#ef4444">' +
              ex.message +
              "</td></tr>";
          }
        }
        function fmtDate(d) {
          if (!d) return "-";
          var dt = new Date(d);
          return isNaN(dt)
            ? d
            : dt.toLocaleDateString("en-MY", {
                day: "numeric",
                month: "short",
                year: "numeric",
              });
        }
        function renderTable(posts) {
          if (!posts.length) {
            G("tableBody").innerHTML =
              '<tr><td colspan="6" class="empty-row">No articles yet. Click <b>+ New Article</b> to get started.</td></tr>';
            return;
          }
          G("tableBody").innerHTML = posts
            .map(function (p) {
              var pub = p.status === "published";
              var badge = pub
                ? '<span class="badge badge-pub">Published</span>'
                : '<span class="badge badge-draft">Draft</span>';
              return (
                "<tr>" +
                '<td class="td-title">' +
                (p.title || "-") +
                "</td>" +
                '<td><span class="badge badge-cat">' +
                (p.category || "-") +
                "</span></td>" +
                '<td class="td-slug">' +
                (p.slug || "-") +
                "</td>" +
                '<td class="td-date">' +
                fmtDate(p.publishedAt) +
                "</td>" +
                "<td>" +
                badge +
                "</td>" +
                '<td class="td-act">' +
                '<button class="btn-edit" data-id="' +
                p.id +
                '" data-action="edit">Edit</button> ' +
                '<button class="btn-del" data-id="' +
                p.id +
                '" data-title="' +
                (p.title || "").replace(/"/g, "") +
                '" data-action="del">Delete</button>' +
                "</td></tr>"
              );
            })
            .join("");
        }
        G("tableBody").addEventListener("click", async function (e) {
          var btn = e.target.closest("[data-action]");
          if (!btn) return;
          var id = btn.dataset.id;
          if (btn.dataset.action === "edit") {
            var snap = await FS.getDoc(FS.doc(db, COLL, id));
            if (snap.exists())
              openModal(Object.assign({ id: snap.id }, snap.data()));
          } else if (btn.dataset.action === "del") {
            if (
              !confirm('Delete "' + btn.dataset.title + '"? Cannot be undone.')
            )
              return;
            try {
              await FS.deleteDoc(FS.doc(db, COLL, id));
              toast("Article deleted");
              await loadPosts();
            } catch (ex) {
              toast(es.message, false);
            }
          }
        });
        G("searchInput").addEventListener("input", function (e) {
          var q = e.target.value.toLowerCase();
          renderTable(
            allPosts.filter(function (p) {
              return (
                (p.title || "").toLowerCase().indexOf(q) > -1 ||
                (p.slug || "").toLowerCase().indexOf(q) > -1
              );
            }),
          );
        });
        G("catFilter").addEventListener("change", function (e) {
          var cat = e.target.value;
          renderTable(
            cat
              ? allPosts.filter(function (p) {
                  return p.category === cat;
                })
              : allPosts,
          );
        });
        function makeSlug(title) {
          var s = title.toLowerCase().trim(),
            result = "";
          for (var i = 0; i < s.length; i++) {
            var c = s[i];
            if ((c >= "a" && c <= "z") || (c >= "0" && c <= "9") || c === "-")
              result += c;
            else if (c === " ") result += "-";
          }
          while (result.indexOf("--") > -1)
            result = result.split("--").join("-");
          return result;
        }
        function openModal(post) {
          editingId = post ? post.id : null;
          G("modalTitle").textContent = post ? "Edit Article" : "New Article";
          G("fTitle").value = (post && post.title) || "";
          G("fSlug").value = (post && post.slug) || "";
          G("fCategory").value = (post && post.category) || "";
          G("fExcerpt").value = (post && post.excerpt) || "";
          G("fThumb").value = (post && post.thumbnail) || "";
          G("fReadTime").value = (post && post.readTime) || "";
          G("fMetaDesc").value = (post && post.metaDesc) || "";
          G("fStatus").value = (post && post.status) || "draft";
          G("fDate").value =
            post && post.publishedAt
              ? post.publishedAt.substring(0, 10)
              : new Date().toISOString().substring(0, 10);
          G("fReadMore").value = (post && post.readMoreUrl) || "";
          const initialHtml = (post && post.content) || "";
          try {
            const delta = quill.clipboard.convert({ html: initialHtml });
            quill.setContents(delta, "silent");
          } catch (e) {
            quill.clipboard.dangerouslyPasteHTML(initialHtml);
          }
          G("fContent").value = (post && post.content) || "";
          G("saveErr").style.display = "none";
          G("modalOverlay").classList.add("open");
          setTimeout(function () {
            G("fTitle").focus();
          }, 60);
        }
        function closeModal() {
          G("modalOverlay").classList.remove("open");
          editingId = null;
        }
        G("fTitle").addEventListener("input", function () {
          if (!editingId) G("fSlug").value = makeSlug(G("fTitle").value);
        });
        G("newPostBtn").addEventListener("click", function () {
          openModal(null);
        });
        G("modalClose").addEventListener("click", closeModal);
        G("cancelBtn").addEventListener("click", closeModal);
        G("modalOverlay").addEventListener("click", function (e) {
          if (e.target === G("modalOverlay")) closeModal();
        });
        G("saveBtn").addEventListener("click", async function () {
          var btn = G("saveBtn"),
            err = G("saveErr");

          // Sync Quill content to hidden field
          var htmlContent = quill.getSemanticHTML();
          if (htmlContent === "<p><br></p>" || htmlContent === "")
            htmlContent = "";
          G("fContent").value = htmlContent;

          var data = {
            title: G("fTitle").value.trim(),
            slug: G("fSlug").value.trim(),
            category: G("fCategory").value.trim(),
            excerpt: G("fExcerpt").value.trim(),
            thumbnail: G("fThumb").value.trim(),
            readTime: parseInt(G("fReadTime").value) || 5,
            metaDesc: G("fMetaDesc").value.trim(),
            status: G("fStatus").value,
            publishedAt: G("fDate").value,
            content: G("fContent").value.trim(),
            readMoreUrl: G("fReadMore").value.trim(),
            updatedAt: FS.serverTimestamp(),
          };
          if (!data.title || !data.slug || !data.content) {
            err.textContent = "Title, slug, and content are required.";
            err.style.display = "block";
            return;
          }
          btn.textContent = "Saving...";
          btn.disabled = true;
          try {
            if (editingId) {
              await FS.updateDoc(FS.doc(db, COLL, editingId), data);
              toast("Article updated");
            } else {
              data.createdAt = FS.serverTimestamp();
              await FS.addDoc(FS.collection(db, COLL), data);
              toast("Article published");
            }
            closeModal();
            await loadPosts();
          } catch (ex) {
            err.textContent = ex.message;
            err.style.display = "block";
            toast(es.message, false);
          }
          btn.textContent = "Save Article";
          btn.disabled = false;
        });
      })();
    </script>
  </body>
</html>
