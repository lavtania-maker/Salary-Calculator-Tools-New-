<script>
(async function() {
  var FB = 'https://www.gstatic.com/firebasejs/10.12.0/';
  var cfg = {apiKey:"AIzaSyAT1xtn2fSPbxUrIyJvK_r449D_WB6Ete8",authDomain:"gen-lang-client-0273291777.firebaseapp.com",projectId:"gen-lang-client-0273291777"};
  var DB_ID = "ai-studio-f7c7f3ec-1f6a-45a9-a332-4733fe85d918";
  var COLL = "blog_posts";
  var CATEGORY_FILTER = "Salary";
  var App = await import(FB + 'firebase-app.js');
  var FS = await import(FB + 'firebase-firestore.js');
  var app = App.initializeApp(cfg);
  var db = FS.getFirestore(app, DB_ID);
  function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d);
    return isNaN(dt) ? d : dt.toLocaleDateString('en-MY', {day:'numeric',month:'long',year:'numeric'});
  }
  function card(p) {
    var cats = (p.category||'').split(',').map(function(c){return c.trim();}).filter(Boolean);
    return '<a class="post-card" href="/blog/'+(p.slug||p.id)+'">'
      +'<div class="card-cat">'+cats.map(function(c){return '<span>'+c+'</span>';}).join('')+'</div>'
      +'<h2 class="card-title">'+(p.title||'Untitled')+'</h2>'
      +(p.excerpt?'<p class="card-excerpt">'+p.excerpt+'</p>':'')
      +'<div class="card-date">'+fmtDate(p.publishedAt)+'</div></a>';
  }
  function render(posts) {
    var c = document.getElementById('articlesContainer');
    if (!posts.length) { c.innerHTML='<div class="empty-state"><h2>No articles in this topic yet</h2><p>Check back soon — new guides are added regularly.</p></div>'; return; }
    var h = '<div class="posts-grid">';
    for (var i=0;i<posts.length;i++) h += card(posts[i]);
    if (posts.length%2!==0) h += '<div class="post-card" style="background:#f8faff"></div>';
    h += '</div>';
    c.innerHTML = h;
  }
  async function loadPosts() {
    try {
      var q = FS.query(FS.collection(db,COLL), FS.where('status','==','published'), FS.orderBy('publishedAt','desc'));
      var s = await FS.getDocs(q);
      var all = s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      var filtered = all.filter(function(p){return (p.category||'').indexOf(CATEGORY_FILTER)>-1;});
      render(filtered);
    } catch(e) {
      try {
        var q2 = FS.query(FS.collection(db,COLL), FS.orderBy('createdAt','desc'));
        var s2 = await FS.getDocs(q2);
        var all2 = s2.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(p){return p.status==='published';});
        var filtered2 = all2.filter(function(p){return (p.category||'').indexOf(CATEGORY_FILTER)>-1;});
        render(filtered2);
      } catch(e2) {
        document.getElementById('articlesContainer').innerHTML='<div class="empty-state"><h2>No articles in this topic yet</h2><p>Check back soon — new guides are added regularly.</p></div>';
      }
    }
  }
  var navToggle=document.getElementById('navToggle'),navLinks=document.getElementById('navLinks');
  navToggle.addEventListener('click',function(){
    var open=navLinks.classList.toggle('open');
    navToggle.classList.toggle('open',open);
    navToggle.setAttribute('aria-expanded',open?'true':'false');
  });
  await loadPosts();
})();
</script>
