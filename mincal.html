<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel - Leads</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 0.9rem;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: #f1f5f9;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        td {
            font-size: 0.9rem;
        }
        #loginSection, #adminSection {
            display: none;
        }
        .error {
            color: #dc2626;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .dashboard-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="loginSection">
            <h1>Admin Login</h1>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Please sign in to access the leads.</p>
            <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="adminUsername" style="display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 500;">Username</label>
                    <input type="text" id="adminUsername" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box;">
                </div>
                <div>
                    <label for="adminPassword" style="display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 500;">Password</label>
                    <input type="password" id="adminPassword" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box;">
                </div>
                <button type="submit" id="loginBtn" class="btn" style="margin-top: 10px;">Sign In</button>
            </form>
            <div id="loginError" class="error"></div>
        </div>

        <div class="card" id="adminSection">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1 style="margin: 0;">Dashboard</h1>
                <div style="display: flex; gap: 10px;">
                    <button id="exportBtn" class="btn" style="background: #10b981;">Export CSV</button>
                    <button id="logoutBtn" class="btn" style="background: #ef4444;">Logout</button>
                </div>
            </div>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total Emails Collected</div>
                </div>
            </div>

            <h2 style="font-size: 1.2rem; margin-top: 30px; margin-bottom: 10px;">Recent Submissions</h2>
            
            <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="dateFrom" style="font-weight: 600; font-size: 0.9rem;">Created (From)</label>
                    <input type="date" id="dateFrom" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; color: var(--text-main);">
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="dateTo" style="font-weight: 600; font-size: 0.9rem;">Created (to)</label>
                    <input type="date" id="dateTo" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; color: var(--text-main);">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="submitFilterBtn" class="btn" style="background: var(--primary); padding: 8px 16px;">Submit</button>
                    <button id="clearFilterBtn" class="btn" style="background: var(--text-muted); padding: 8px 16px;">Clear Filter</button>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="selectAll"></th>
                            <th>Email</th>
                            <th>Action</th>
                            <th id="sortDateBtn" style="cursor: pointer; user-select: none;" title="Click to sort">Date ↕</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody">
                        <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="/src/mincal.ts"></script>
</body>
</html>
